name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.1). Leave empty if running on a tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # If a tag input was provided during manual dispatch, checkout that tag!
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Validate release tag and prepare version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          # Determine raw tag name (from manual input or git ref)
          RAW_TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION_NAME="${RAW_TAG#v}"
          
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH. Received: '$RAW_TAG'" >&2
            exit 1
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          if (( MAJOR > 999 || MINOR > 999 || PATCH > 999 )); then
            echo "Each semantic version segment must be at most 999." >&2
            exit 1
          fi
          
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 )); then
            echo "Android version code must be positive." >&2
            exit 1
          fi
          
          test "$(node -p "require('./package.json').version")" = "$VERSION_NAME"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build signed Android artifacts
        env:
          NEXT_PUBLIC_SERVERLESS: 'true'
          NEXT_PUBLIC_SITE_URL: ${{ vars.PAGES_SITE_URL || vars.PUBLIC_SITE_URL || 'https://example.com' }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: pnpm android:bundle -- --version-code=${{ steps.version.outputs.code }} --version-name=${{ steps.version.outputs.name }}

      - name: Create checksum file
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          sha256sum "$APK" > sha.txt
          sha256sum "$AAB" >> sha.txt

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.version.outputs.tag }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            sha.txt
