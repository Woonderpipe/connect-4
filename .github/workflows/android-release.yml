name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.1). Leave empty if running on a tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # If a tag input was provided during manual dispatch, checkout that tag!
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Validate release tag and prepare version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          # Determine raw tag name (from manual input or git ref)
          RAW_TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION_NAME="${RAW_TAG#v}"
          
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH. Received: '$RAW_TAG'" >&2
            exit 1
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          if (( MAJOR > 999 || MINOR > 999 || PATCH > 999 )); then
            echo "Each semantic version segment must be at most 999." >&2
            exit 1
          fi
          
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 )); then
            echo "Android version code must be positive." >&2
            exit 1
          fi
          
          test "$(node -p "require('./package.json').version")" = "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
